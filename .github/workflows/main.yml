name: Build x64 Ascend 950 prerelease
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make cmake git curl clang pkg-config wget python3 zlib1g-dev libssl-dev
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Fetch dependencies
        env:
          PEARL_REF: master
        run: bash scripts/fetch_deps.sh
      - name: Download and Install Ascend CANN Toolkit
        run: |
          wget -q https://ascend.devcloud.huaweicloud.com/artifactory/cann-run-mirror/software/legacy/20260422000325096/Ascend-cann-toolkit_9.0.0_linux-x86_64.run
          chmod +x Ascend-cann-toolkit_9.0.0_linux-x86_64.run
          bash ./Ascend-cann-toolkit_9.0.0_linux-x86_64.run --install --quiet
          sudo su -c "
            rustup default stable
          "
      - name: Verify CPU backend and build
        run: |
          bash scripts/build.sh NPU_ARCH=dav-3510 RANK=128
          file build/*
          readelf -h build/ascend_prl_kryptex | grep 'Advanced Micro Devices X86-64'
          cp vendor/DEPENDENCY_REVISIONS.txt build/
      - name: Package build output
        run: tar -czf build-x86_64-ascend950.tar.gz -C build .
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release-${{ github.run_number }}-${{ github.run_attempt }}
          name: x64 Ascend 950 build ${{ github.run_number }}
          prerelease: true
          files: |
            build-x86_64-ascend950.tar.gz
